name: Android build

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # compileSdk 37 platform and the build tools AGP uses; runner images can lag behind new platforms.
  ANDROID_PACKAGES: platforms;android-37.0 build-tools;36.0.0

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.apk.outputs.version }}
      signed_with_release_key: ${{ steps.apk.outputs.signed_with_release_key }}
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" $ANDROID_PACKAGES > /dev/null

      - name: Decode the release signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        # Exports SIGNING_KEYSTORE_FILE and SIGNING_KEY_ALIAS (auto-detected when the file holds one key).
        run: bash .github/scripts/decode-signing-key.sh

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Name and verify the APK
        id: apk
        run: |
          tools="$ANDROID_HOME/build-tools/36.0.0"
          source=app/build/outputs/apk/release/app-release.apk
          version=$("$tools/aapt2" dump badging "$source" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          mkdir -p dist
          cp "$source" "dist/gym-tracker-$version.apk"
          "$tools/apksigner" verify --print-certs "dist/gym-tracker-$version.apk" | grep -E "certificate DN|SHA-256"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "signed_with_release_key=$HAS_SIGNING_KEY" >> "$GITHUB_OUTPUT"
          {
            echo "## Gym Tracker $version"
            echo
            echo "APK: блок **Artifacts** нижче → \`gym-tracker-apk\` (zip з файлом \`gym-tracker-$version.apk\`)."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            echo "Підписано твоїм ключем: встановлюється поверх попередньої версії, дані зберігаються." >> "$GITHUB_STEP_SUMMARY"
          else
            message="APK підписано тимчасовим debug-ключем, який змінюється з кожною збіркою: наступна версія не встановиться поверх цієї без видалення (і втрати даних). Для постійного користування додай ключ — docs/SIGNING.md."
            echo "::warning::$message"
            echo "> ⚠️ $message" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gym-tracker-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" $ANDROID_PACKAGES > /dev/null

      - name: Unit tests, Robolectric UI tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug

      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/screenshots/
          retention-days: 14

  emulator:
    name: Launch on Android emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: gym-tracker-apk
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The release APK is minified by R8; this catches crashes that unit tests cannot see.
      - name: Install the APK and open the main screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/emulator-smoke-test.sh dist

      - name: Upload emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: smoke/
          retention-days: 14

  publish:
    name: Publish to Releases
    needs: [build, test, emulator]
    # Only APKs signed with the private key are published: they are the ones that update each other.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref_name == github.event.repository.default_branch &&
      needs.build.outputs.signed_with_release_key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gym-tracker-apk
          path: dist

      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cp dist/*.apk gym-tracker.apk
          cat > notes.md <<NOTES
          Збірка з коміту ${GITHUB_SHA::7}.

          **Встановлення на телефоні:** відкрий цю сторінку в браузері телефона → \`gym-tracker.apk\` →
          дозволь браузеру встановлювати застосунки. Нова версія ставиться поверх старої, дані зберігаються.

          Постійне посилання на останню версію:
          https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/gym-tracker.apk
          NOTES
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest gym-tracker.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Gym Tracker $VERSION" \
            --notes-file notes.md \
            --latest
